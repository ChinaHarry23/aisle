<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="Spring produce: strawberries, asparagus and a mango on a fresh green and lime backdrop">
  <defs>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7b731"/>
      <stop offset="0.6" stop-color="#f08a24"/>
      <stop offset="1" stop-color="#e2523a"/>
    </linearGradient>
    <linearGradient id="berry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef3b4c"/>
      <stop offset="1" stop-color="#c41f35"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f9a58"/>
      <stop offset="1" stop-color="#0c7a3e"/>
    </linearGradient>
    <g id="strawberry">
      <path d="M0 -90 C 70 -90 112 -40 92 22 C 76 72 30 112 0 124 C -30 112 -76 72 -92 22 C -112 -40 -70 -90 0 -90 Z" fill="url(#berry)"/>
      <g fill="#ffe08a">
        <ellipse cx="-42" cy="-28" rx="5" ry="8"/><ellipse cx="0" cy="-36" rx="5" ry="8"/><ellipse cx="42" cy="-28" rx="5" ry="8"/>
        <ellipse cx="-62" cy="14" rx="5" ry="8"/><ellipse cx="-20" cy="8" rx="5" ry="8"/><ellipse cx="22" cy="8" rx="5" ry="8"/><ellipse cx="62" cy="14" rx="5" ry="8"/>
        <ellipse cx="-38" cy="50" rx="5" ry="8"/><ellipse cx="0" cy="44" rx="5" ry="8"/><ellipse cx="38" cy="50" rx="5" ry="8"/>
        <ellipse cx="-12" cy="86" rx="5" ry="8"/><ellipse cx="14" cy="86" rx="5" ry="8"/>
      </g>
      <path d="M0 -84 L -26 -112 L -10 -90 L -52 -92 L -22 -78 L -48 -62 L -8 -72 L 0 -50 L 8 -72 L 48 -62 L 22 -78 L 52 -92 L 10 -90 L 26 -112 Z" fill="#008446"/>
      <rect x="-5" y="-130" width="10" height="42" rx="5" fill="#0c7a3e"/>
    </g>
  </defs>

  <!-- backdrop -->
  <rect width="1080" height="1350" fill="#ffffff"/>
  <circle cx="540" cy="900" r="380" fill="#c8f170"/>
  <circle cx="540" cy="900" r="300" fill="#e3f7b4"/>
  <rect x="0" y="1180" width="1080" height="170" fill="#008446"/>
  <rect x="0" y="1170" width="1080" height="14" fill="#c8f170"/>

  <!-- type -->
  <text x="80" y="120" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="6" fill="#008446">WOOLWORTHS · SPRING</text>
  <text x="80" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#25251f">In season now.</text>
  <text x="80" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#008446">Fresh every day.</text>
  <text x="80" y="430" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#4a4a42">Australian grown where labelled.</text>

  <!-- asparagus bundle -->
  <g transform="translate(330 1160) rotate(-8)">
    <g fill="url(#stem)">
      <rect x="-86" y="-430" width="34" height="430" rx="17"/>
      <rect x="-48" y="-500" width="34" height="500" rx="17"/>
      <rect x="-10" y="-460" width="34" height="460" rx="17"/>
      <rect x="28" y="-510" width="34" height="510" rx="17"/>
      <rect x="66" y="-420" width="34" height="420" rx="17"/>
    </g>
    <g fill="#0a6a36">
      <path d="M-86 -430 q17 -46 34 0 z"/><path d="M-48 -500 q17 -46 34 0 z"/><path d="M-10 -460 q17 -46 34 0 z"/><path d="M28 -510 q17 -46 34 0 z"/><path d="M66 -420 q17 -46 34 0 z"/>
    </g>
    <rect x="-100" y="-150" width="214" height="34" rx="8" fill="#c8f170"/>
    <rect x="-100" y="-150" width="214" height="34" rx="8" fill="none" stroke="#008446" stroke-width="3"/>
  </g>

  <!-- mango -->
  <g transform="translate(760 1010) rotate(-24)">
    <ellipse cx="0" cy="0" rx="160" ry="118" fill="url(#mango)"/>
    <ellipse cx="-54" cy="-46" rx="64" ry="26" fill="#ffffff" opacity="0.28" transform="rotate(-14 -54 -46)"/>
    <path d="M-6 -116 C 20 -150 70 -156 104 -134 C 70 -112 30 -106 -6 -116 Z" fill="#008446"/>
    <rect x="-12" y="-130" width="12" height="26" rx="6" fill="#0c7a3e"/>
  </g>

  <!-- strawberries -->
  <use href="#strawberry" transform="translate(560 960) rotate(10)"/>
  <use href="#strawberry" transform="translate(440 1100) scale(0.62) rotate(-18)"/>

  <!-- call to action -->
  <rect x="80" y="1236" width="400" height="76" rx="38" fill="#c8f170"/>
  <text x="280" y="1285" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#024a1f">Shop fresh produce</text>
</svg>
